<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
  <script src="lucide.min.js"></script>
  <title>Toolbox</title>
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="logo">Toolbox</span>
      <button class="theme-toggle" id="themeToggle" title="Toggle theme">
        <i data-lucide="moon" width="14" height="14"></i>
      </button>
    </div>
    <div class="tools-grid">
      <div class="tool-item" data-tool="notepad">
        <i data-lucide="notebook-pen" class="tool-icon"></i>
        <span class="tool-name">Notepad</span>
      </div>
      <div class="tool-item" data-tool="sticky">
        <i data-lucide="sticky-note" class="tool-icon"></i>
        <span class="tool-name">Sticky Notes</span>
      </div>
      <div class="tool-item" data-tool="highlighter">
        <i data-lucide="highlighter" class="tool-icon"></i>
        <span class="tool-name">Highlighter</span>
      </div>
      <div class="tool-item" data-tool="screenshot">
        <i data-lucide="camera" class="tool-icon"></i>
        <span class="tool-name">Screenshot</span>
      </div>
      <div class="tool-item" data-tool="reader">
        <i data-lucide="book-open" class="tool-icon"></i>
        <span class="tool-name">Reader Mode</span>
      </div>
      <div class="tool-item" data-tool="todo">
        <i data-lucide="check-square" class="tool-icon"></i>
        <span class="tool-name">Todo</span>
      </div>
      <div class="tool-item" data-tool="pomodoro">
        <i data-lucide="timer" class="tool-icon"></i>
        <span class="tool-name">Pomodoro</span>
      </div>
      <div class="tool-item" data-tool="colorpicker">
        <i data-lucide="pipette" class="tool-icon"></i>
        <span class="tool-name">Color Picker</span>
      </div>
      <div class="tool-item" data-tool="wordcount">
        <i data-lucide="bar-chart-2" class="tool-icon"></i>
        <span class="tool-name">Word Count</span>
      </div>
      <div class="tool-item" data-tool="ruler">
        <i data-lucide="ruler" class="tool-icon"></i>
        <span class="tool-name">Ruler</span>
      </div>
      <div class="tool-item" data-tool="imgdownloader">
        <i data-lucide="image-down" class="tool-icon"></i>
        <span class="tool-name">Image DL</span>
      </div>
    </div>
    <div class="tool-view" id="toolView" style="display:none;">
      <div class="tool-header">
        <button class="back-btn" id="backBtn">
          <i data-lucide="arrow-left" width="12" height="12"></i> Back
        </button>
        <span class="tool-title" id="toolTitle"></span>
      </div>
      <div class="tool-content" id="toolContent"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
